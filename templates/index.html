<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Course - Video Progress Tracker</title>
    <link rel="stylesheet" href="/static/styles.css">
    <script src="/static/progress-tracker.js"></script>
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="container">
        <!-- Course Navigation -->
        <div class="course-nav">
            <div class="breadcrumb">
                <span>Python Fundamentals</span>
                <span class="separator">›</span>
                <span>Module 1</span>
            </div>
            <h1 class="course-title">Module 1: Introduction to Python</h1>
        </div>
        
        <!-- Video Player -->
        <div class="video-container">
            <!-- Last watched overlay -->
            <div id="last-watched-overlay" class="last-watched-overlay hidden">
                Last watched at <span id="last-position-time">00:00</span> — Resuming...
            </div>
            
            <video id="lecture-video" poster="https://via.placeholder.com/1280x720/000000/FFFFFF?text=Python+Programming">
                <source src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>
            
            
            <!-- Video Controls -->
            <div class="video-controls">
                <div class="control-buttons">
                    <button id="skip-back" class="control-button">
                        <i class="fas fa-step-backward"></i>
                    </button>
                    <button id="play-pause" class="control-button">
                        <i class="fas fa-play" id="play-icon"></i>
                    </button>
                    <button id="skip-forward" class="control-button">
                        <i class="fas fa-step-forward"></i>
                    </button>
                    <div id="time-display" class="time-display">00:00 / 00:00</div>
                    <div class="volume-control">
                        <i class="fas fa-volume-up"></i>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Progress Section -->
        <div class="progress-section">
            <div class="progress-header">
                <h2>Video Process</h2>
                <div class="progress-percentage"><span id="progress-percent">0</span>% Complete</div>
            </div>
            
            <!-- Progress Bar -->
            <div class="progress-bar-container">
                <div id="progress-bar" class="progress-bar"></div>
            </div>
            
            <!-- Progress Stats -->
            <div class="progress-stats">
                <div id="unique-minutes-watched">You've watched 0 minutes of content</div>
                <div id="total-duration">Total duration: 0:00</div>
            </div>
            
            <!-- Progress Info -->
            <div class="progress-info">
                <div class="info-item">
                    <div class="info-circle blue" id="hours-ago">2</div>
                    <span>Last watched <span id="hours-count">2</span> hours ago</span>
                </div>
                <div class="info-item">
                    <div class="info-circle green">5</div>
                    <span>Minutes remaining</span>
                </div>
            </div>
        </div>
    </div>

    <script src="progress-tracker.js"></script>
</body>
</html>
